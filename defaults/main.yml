mysql_backup_db_host: "localhost"
mysql_backup_db_user: "root"
mysql_backup_db_password: "root"
mysql_backup_db_names:
  - "test"
mysql_backup_local_dir: "/tmp/mysql-backup"
mysql_backup_disk_space_threshold: 80
mysql_backup_remote_storage: "none" # gcs/s3 supported
mysql_backup_bucket_name: "backups"
mysql_backup_bucket_dir: "mysql"
mysql_backup_bucket_dir_split_by_months: false
mysql_backup_use_compression: true
mysql_backup_delete_locally: false
mysql_backup_skip_when_delete_locally: 0
mysql_backup_telergam_api_token: ""
mysql_backup_telegram_chat_id: ""

## For AWS auth using access keys
mysql_backup_aws_access_key_id: ""
mysql_backup_aws_secret_access_key: ""
mysql_backup_aws_region: ""

## For GCP auth using credentials json file
mysql_backup_gcp_credentials_file: ""

## Cron scheduler settings
mysql_backup_cron_minute: 15
mysql_backup_cron_hour: 0
mysql_backup_cron_day: "*"
mysql_backup_cron_month: "*"
mysql_backup_cron_weekday: "*"