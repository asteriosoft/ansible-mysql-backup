---
- name: Create backup directory
  file:
    path: "{{ mysql_backup_local_dir }}"
    state: directory

- name: Install python requirenments
  pip:
    name:
      - google-cloud-storage
      - boto3

- name: Copy mysql-backup.py script
  template:
    src: "mysql-backup.py"
    dest: '/usr/bin/mysql-backup.py'
    mode: 0755

- name: Add cronjob for mysql-backup
  cron:
    name: Mysql backup and upload to remote bucket
    minute: "{{ mysql_backup_cron_minute }}"
    hour: "{{ mysql_backup_cron_hour }}"
    day: "{{ mysql_backup_cron_day }}"
    month: "{{ mysql_backup_cron_month }}"
    weekday: "{{ mysql_backup_cron_weekday }}"
    job: 'mysql-backup.py >> /var/log/mysql-backup.log 2>&1'

- name: Add crontab env variables
  cron:
    name: "{{ item.name }}"
    env: yes
    job: "{{ item.value }}"
  when: item.value != ''
  loop:
    - { name: 'AWS_ACCESS_KEY_ID', value: '{{ mysql_backup_aws_access_key_id }}' }
    - { name: 'AWS_SECRET_ACCESS_KEY', value: '{{ mysql_backup_aws_secret_access_key }}' }
    - { name: 'AWS_DEFAULT_REGION', value: '{{ mysql_backup_aws_region }}' }
    - { name: 'GOOGLE_APPLICATION_CREDENTIALS', value: '{{ mysql_backup_gcp_credentials_file }}' }

- name: Copy logrotate conf for mysql-backup logs
  copy:
    src: logrotate.conf
    dest: /etc/logrotate.d/mysql-backup
    owner: root
    group: root
    mode: '0644'