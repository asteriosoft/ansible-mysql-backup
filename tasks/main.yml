---
- name: Create backup directory
  file:
    path: "{{ mysql_backup_local_dir }}"
    state: directory

- name: Install python requirenments
  pip:
    name:
      - google-cloud-storage
      - requests

- name: Copy mysql-backup.py script
  template:
    src: "mysql-backup.py"
    dest: '/usr/bin/mysql-backup.py'
    mode: 0755

- name: Add cronjob for mysql-backup
  cron:
    name: Mysql backup and upload to remote bucket
    minute: '15'
    hour: '0'
    job: 'mysql-backup.py >> /var/log/mysql-backup.log 2>&1'

- name: Copy logrotate conf for mysql-backup logs
  copy:
    src: logrotate.conf
    dest: /etc/logrotate.d/mysql-backup
    owner: root
    group: root
    mode: '0644'